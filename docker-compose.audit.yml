  sustainability-service:
    container_name: !reset null
    restart: "no"
    ports: !reset []
  marketplace-service:
    container_name: !reset null
    restart: "no"
    ports: !reset []
  admin-reporting-service:
    container_name: !reset null
    restart: "no"
    ports: !reset []
  delivery-service:
